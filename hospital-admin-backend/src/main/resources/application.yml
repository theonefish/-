server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-admin
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_registration_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  # redis:
  #   host: localhost
  #   port: 6379
  #   password:
  #   database: 0
  #   timeout: 3000ms
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-idle: 8
  #       min-idle: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.hospital.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT配置
jwt:
  secret: hospitalSecretKey2024!@#$%^&*
  expiration: 7200000
  header: Authorization
  prefix: Bearer

# 微信小程序配置
wx:
  miniapp:
    appid: your-app-id
    secret: your-app-secret

# 文件上传路径
upload:
  path: ./uploads/
